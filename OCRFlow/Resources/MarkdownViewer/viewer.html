<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  The rendered Markdown pane. markdown-it lays out the document — tables with
  their merged cells included, since recognised tables arrive as HTML — and
  KaTeX sets every formula. Both ship inside the app: nothing is fetched.

  The text shown is whatever was recognised on a page, so the page is locked
  down twice: viewer.js keeps only harmless formatting from any HTML in it,
  and this policy forbids every network load and every inline script —
  scripts come only from this folder, images only from the figures' data
  URLs. Inline styles stay allowed: KaTeX positions every glyph with them.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="katex.min.css">
<style>
  :root {
    color-scheme: light dark;
    --text: -apple-system-label;
    --secondary: -apple-system-secondary-label;
    --rule: rgba(127, 127, 127, 0.28);
    --header: rgba(127, 127, 127, 0.12);
    --accent: #0D9888;
    --accent-soft: rgba(13, 152, 136, 0.16);
    --flag: rgba(255, 149, 0, 0.15);
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font: 13px/1.65 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: text;
  }
  main { padding: 14px 20px 40px; max-width: 920px; }
  section { padding: 2px 8px; margin: 0 -8px; border-radius: 6px; cursor: default; }
  section.flagged { background: var(--flag); }
  section.selected { background: var(--accent-soft); }
  h1, h2, h3, h4, h5, h6 { line-height: 1.3; margin: 1.1em 0 0.45em; font-weight: 650; }
  h1 { font-size: 1.6em; } h2 { font-size: 1.35em; } h3 { font-size: 1.15em; } h4, h5, h6 { font-size: 1em; }
  p { margin: 0.55em 0; }
  ul, ol { padding-left: 1.6em; margin: 0.5em 0; }
  blockquote { margin: 0.6em 0; padding: 0 0 0 12px; border-left: 3px solid var(--rule); color: var(--secondary); }
  code { font: 12px "SF Mono", Menlo, monospace; background: var(--header); padding: 1px 4px; border-radius: 4px; }
  pre { background: var(--header); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  hr { border: none; border-top: 1px solid var(--rule); margin: 1em 0; }
  a { color: var(--accent); }
  .table-wrap { overflow-x: auto; margin: 0.7em 0; }
  table { border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th, td { border: 1px solid var(--rule); padding: 5px 9px; text-align: left; vertical-align: top; }
  th, table.implicit-header tr:first-child > td { background: var(--header); font-weight: 600; }
  .katex { font-size: 1.08em; }
  .katex-display { margin: 0.7em 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
  img.figure { display: block; max-width: 100%; max-height: 460px; border-radius: 4px; margin: 0.6em 0; }
  .figure-missing { color: var(--secondary); font-size: 12px; border: 1px dashed var(--rule);
                    border-radius: 6px; padding: 8px 12px; margin: 0.6em 0; }
  section.editing { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .edit-text { outline: none; white-space: pre-wrap; min-height: 1.65em; padding: 0.55em 0; }
  td[contenteditable], th[contenteditable] { outline: none; cursor: text; }
  td[contenteditable]:focus, th[contenteditable]:focus { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .edit-latex { display: block; width: 100%; box-sizing: border-box; resize: none; overflow: hidden;
                margin: 4px 0 8px; padding: 6px 8px; border: none; border-radius: 6px; outline: none;
                font: 12px/1.5 "SF Mono", Menlo, monospace; color: var(--secondary);
                background: rgba(127, 127, 127, 0.12); }
  .math-error { color: var(--secondary); font-family: "SF Mono", Menlo, monospace; font-size: 12px; }
</style>
<script src="markdown-it.min.js"></script>
<script src="katex.min.js"></script>
</head>
<body>
<main id="doc"></main>
<script src="viewer.js"></script>
</body>
</html>
