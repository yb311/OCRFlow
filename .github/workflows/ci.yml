name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Restore llama.xcframework
        id: llama-cache
        uses: actions/cache@v6
        with:
          path: Vendor/llama.xcframework
          key: llama-${{ hashFiles('Scripts/fetch-llama-xcframework.sh') }}

      - name: Fetch llama.xcframework
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: Scripts/fetch-llama-xcframework.sh

      - name: Restore bundled models
        id: models-cache
        uses: actions/cache@v6
        with:
          path: OCRFlow/Resources/PaddleOCR
          key: ppocr-${{ hashFiles('Scripts/fetch-paddleocr-models.sh') }}

      - name: Fetch bundled models
        if: steps.models-cache.outputs.cache-hit != 'true'
        run: Scripts/fetch-paddleocr-models.sh bundled

      - name: Build
        run: |
          xcodebuild -project OCRFlow.xcodeproj -scheme OCRFlow \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check markup leaks
        run: Scripts/check-markup-leaks.sh
