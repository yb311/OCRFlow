<!doctype html>
<meta charset="utf-8">
<title>OCRFlow how-to</title>
<style>
  :root { --mint: #8ff0d8; --accent: #15b899; --sel: #2fb8a0; --win: #1f2022; --side: #3a3a3b; --line: #000; --text: #f2f3f3; --mute: #a4a7aa; --bar: #2b2c2e; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #030a09; color: var(--text); font: 400 19px/1.4 -apple-system, "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(90% 80% at 50% 25%, #0d3b35, #041311 70%, #030a09); }
  .scene, .layer { position: absolute; inset: 0; visibility: hidden; }
  svg { display: block; flex: none; }

  /* The Mac's menu bar */
  .menubar { position: absolute; inset: 0 0 auto; height: 38px; background: rgba(12, 22, 21, .75); display: flex; align-items: center; gap: 24px; padding: 0 24px; font-size: 17px; }
  .menubar b { font-weight: 700; }
  .menubar .tray { margin-left: auto; display: flex; align-items: center; gap: 22px; }
  .tray-icon { width: 30px; height: 26px; display: grid; place-items: center; border-radius: 5px; }
  .menu { position: absolute; top: 40px; width: 330px; padding: 7px; border-radius: 12px; background: rgba(50, 52, 54, .97); box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.12); font-size: 18px; visibility: hidden; }
  .menu div { padding: 6px 12px; border-radius: 6px; display: flex; justify-content: space-between; }
  .menu hr { border: 0; border-top: 1px solid rgba(255,255,255,.14); margin: 6px 10px; }
  .menu .on { background: #0a84ff; }
  .menu small { color: var(--mute); font-size: 16px; }

  /* An ordinary window */
  .win { position: absolute; border-radius: 16px; overflow: hidden; background: var(--win); box-shadow: 0 34px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.12); }
  .lights { display: flex; gap: 10px; } .lights i { width: 15px; height: 15px; border-radius: 50%; }
  .lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }

  /* OCRFlow's window */
  .side { position: absolute; inset: 0 auto 0 0; width: 320px; background: var(--side); border-right: 1px solid #000; padding: 22px 16px; }
  .search { margin-top: 30px; height: 34px; border-radius: 8px; background: rgba(255,255,255,.08); color: var(--mute); padding: 5px 12px; font-size: 16px; }
  .row { margin-top: 12px; display: flex; gap: 12px; align-items: center; padding: 9px; border-radius: 10px; background: rgba(255,255,255,.14); font-size: 17px; }
  .thumb { width: 38px; height: 50px; background: #fff; border-radius: 3px; flex: none; }
  .row small { display: block; color: var(--mute); font-size: 14px; }
  .row .state { margin-left: auto; font-size: 15px; color: var(--mint); }
  .sidefoot { position: absolute; inset: auto 0 0; height: 48px; border-top: 1px solid #000; display: flex; align-items: center; gap: 20px; padding: 0 20px; color: #cfd1d3; font-size: 22px; }
  .empty { position: absolute; left: 16px; right: 16px; top: 280px; text-align: center; color: var(--mute); font-size: 17px; }
  .top { position: absolute; left: 320px; right: 0; top: 0; height: 66px; border-bottom: 1px solid #000; background: var(--bar); display: flex; align-items: center; gap: 22px; padding: 0 22px; }
  .top > b { font-size: 21px; }
  .seg { display: inline-flex; border-radius: 8px; background: rgba(255,255,255,.08); padding: 2px; font-size: 17px; }
  .seg span { padding: 3px 14px; border-radius: 6px; }
  .seg .on { background: rgba(255,255,255,.2); }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 22px; color: #e6e7e8; }
  .status { font-size: 16px; min-width: 66px; text-align: right; color: var(--mute); }
  .playbtn { width: 34px; height: 34px; border-radius: 50%; background: #d5d7d9; color: #2b2c2e; display: grid; place-items: center; }
  .btn-i { width: 30px; height: 30px; display: grid; place-items: center; }
  .prev { position: absolute; left: 320px; top: 66px; bottom: 0; width: 600px; background: #18191b; border-right: 1px solid #000; }
  .res { position: absolute; left: 920px; right: 0; top: 66px; bottom: 0; background: var(--win); overflow: hidden; }
  .restop { height: 54px; border-bottom: 1px solid #000; display: flex; align-items: center; padding: 0 18px; gap: 16px; }
  .drop { position: absolute; left: 320px; right: 0; top: 66px; bottom: 0; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; background: var(--win); }
  .drop h4 { font-size: 26px; font-weight: 600; }
  .drop p { color: var(--mute); font-size: 16px; }
  .choose { margin-top: 12px; padding: 7px 16px; border-radius: 8px; background: rgba(255,255,255,.12); font-size: 17px; }
  .dropmark { position: absolute; inset: 18px; border: 3px dashed var(--sel); border-radius: 18px; background: rgba(47,184,160,.08); }
  .file { position: absolute; width: 100px; text-align: center; font-size: 14px; }
  .file .thumb { width: 74px; height: 96px; margin: 0 auto 6px; padding: 8px 6px; background: #fff linear-gradient(#b4b6b4 0 0) no-repeat 8px 12px / 50% 6px; box-shadow: 0 8px 20px rgba(0,0,0,.45); }

  /* Paper */
  .doc { position: absolute; left: 34px; right: 34px; top: 26px; aspect-ratio: 62/78; background: #fff; color: #111; padding: 34px 34px; font: 400 15px/1.34 "Times New Roman", "Songti SC", serif; }
  .doc h5 { font: 700 26px/1.2 -apple-system, "PingFang SC", sans-serif; margin-bottom: 14px; }
  .doc h6 { font: 700 18px/1.2 -apple-system, "PingFang SC", sans-serif; margin-bottom: 8px; }
  .doc p { margin-bottom: 16px; }
  .doc table { width: 100%; border-collapse: collapse; margin-bottom: 18px; font-size: 15px; }
  .doc td, .doc th { border: 1px solid #111; padding: 4px 8px; text-align: left; }
  .doc .blk { position: relative; }
  .blk i { position: absolute; inset: -4px -6px; border: 2px solid var(--sel); background: rgba(47,184,160,.08); border-radius: 3px; visibility: hidden; }
  .blk i::before { content: attr(data-n); position: absolute; left: -24px; top: -2px; width: 22px; height: 22px; border-radius: 5px; background: var(--sel); color: #fff; font: 700 13px/22px -apple-system; text-align: center; }
  .blk.hot i { background: rgba(47,184,160,.34); border-width: 3px; }

  /* Results */
  .block { padding: 12px 22px 14px; border-bottom: 1px solid #000; visibility: hidden; }
  .block small { display: flex; justify-content: space-between; color: var(--mute); font-size: 14px; margin-bottom: 4px; font-weight: 600; }
  .block small em { font-style: normal; font-weight: 400; }
  .block h5 { font-size: 22px; font-weight: 650; }
  .block p { font-size: 17px; }
  .block.hot { background: rgba(47,184,160,.18); }
  .block table { border-collapse: separate; border-spacing: 0; border: 1px solid #55585b; border-radius: 6px; font-size: 16px; }
  .block td, .block th { padding: 3px 14px; border-bottom: 1px solid #3c3e41; border-right: 1px solid #3c3e41; text-align: left; }
  .plain { padding: 20px 22px; font-size: 17px; white-space: pre-wrap; visibility: hidden; position: absolute; left: 0; right: 0; top: 54px; }
  .plain.md { font: 15.5px/1.5 ui-monospace, Menlo, "PingFang SC", monospace; }

  /* Other people's windows */
  .page-win { background: #fbfaf5; color: #15191a; }
  .chrome { height: 44px; background: #e7e6e0; display: flex; align-items: center; gap: 14px; padding: 0 16px; color: #555; font-size: 15px; }
  .address { flex: 1; max-width: 560px; margin: 0 auto; background: #fff; border-radius: 7px; padding: 2px 14px; text-align: center; }
  .article { position: absolute; left: 0; right: 0; top: 44px; padding: 50px 120px; font: 400 23px/1.62 "Times New Roman", "Songti SC", serif; }
  .article h2 { font: 700 44px/1.2 -apple-system, "PingFang SC", sans-serif; margin-bottom: 24px; }
  .article p { margin-bottom: 24px; }
  .clip { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; overflow: hidden; }

  /* While capturing */
  .dim { position: absolute; background: rgba(0,0,0,.52); }
  .area { position: absolute; outline: 2px solid #fff; visibility: hidden; }
  .size { position: absolute; padding: 2px 9px; border-radius: 99px; background: rgba(0,0,0,.72); color: #fff; font: 500 14px ui-monospace, Menlo, monospace; visibility: hidden; white-space: nowrap; }
  .capbar { position: absolute; display: flex; align-items: center; gap: 2px; padding: 7px 9px; border-radius: 12px; background: rgba(46,48,50,.97); box-shadow: 0 12px 34px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.14); visibility: hidden; color: #f0f1f1; }
  .capbar > span { width: 42px; height: 36px; display: grid; place-items: center; border-radius: 7px; }
  .capbar .hover { background: rgba(255,255,255,.17); }
  .capbar u { width: 1px; height: 26px; margin: 0 5px; background: rgba(255,255,255,.22); }
  .capbar b { padding: 2px 5px; border-radius: 4px; background: #f0f1f1; color: #2b2c2e; font: 800 12px -apple-system; }
  .capbar .ok { color: var(--accent); }
  .tip { position: absolute; padding: 4px 12px; border-radius: 8px; background: rgba(0,0,0,.82); color: #fff; font-size: 16px; visibility: hidden; white-space: nowrap; }
  .joined { position: absolute; overflow: hidden; border-radius: 5px; box-shadow: 0 6px 18px rgba(0,0,0,.35); background: #fbfaf5; color: #15191a; visibility: hidden; }
  .capsule { position: absolute; display: flex; gap: 8px; align-items: center; padding: 9px 18px; border-radius: 99px; background: rgba(0,0,0,.82); color: #fff; font-weight: 600; font-size: 17px; visibility: hidden; }

  /* OCRFlow's small panels, at the top of the screen */
  .hud { position: absolute; left: 50%; top: 62px; width: 520px; margin-left: -260px; padding: 16px 18px; border-radius: 16px; background: rgba(40,42,44,.97); box-shadow: 0 22px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.13); visibility: hidden; font-size: 16.5px; }
  .hud h4 { font-size: 18px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .hud p { color: var(--mute); margin-top: 6px; }
  .hud .rowbtn { display: flex; gap: 8px; margin-top: 10px; }
  .hud .rowbtn.end { justify-content: flex-end; }
  .pill { padding: 4px 13px; border-radius: 7px; background: rgba(255,255,255,.14); display: inline-flex; gap: 7px; align-items: center; }
  .pill.main { background: #0d9c85; }
  .hud .count { color: var(--mute); font-size: 15px; margin-top: 8px; }
  .choice { display: grid; gap: 8px; margin-top: 12px; }
  .choice .pill { padding: 7px 14px; }

  /* Slides */
  .slide { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; padding: 60px 90px; background: #fff; visibility: hidden; }
  .slide h2 { font: 700 54px/1.2 -apple-system, "PingFang SC", sans-serif; color: #0d4a42; }
  .slide .chart { position: absolute; left: 90px; right: 90px; bottom: 90px; height: 50%; display: flex; gap: 26px; align-items: flex-end; }
  .slide .chart i { flex: 1; background: #3c8578; border-radius: 5px 5px 0 0; }
  .slide .num { position: absolute; right: 30px; bottom: 24px; color: #666; font-size: 20px; }
  .readerpage { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; padding: 50px 110px; overflow: hidden; font: 400 25px/1.6 "Times New Roman", "Songti SC", serif; background: #fbfaf5; color: #15191a; visibility: hidden; }
  .readerpage h3 { font: 700 30px/1.2 -apple-system, "PingFang SC", sans-serif; margin-bottom: 14px; }
  .pgnext { position: absolute; right: 22px; top: 7px; padding: 3px 14px; border-radius: 6px; background: #fff; color: #333; font-size: 15px; box-shadow: 0 0 0 1px #ccc; }
  .taken { position: absolute; border: 2px solid var(--accent); background: rgba(21,184,153,.14); visibility: hidden; }

  /* Macro editor */
  .editor { position: absolute; }
  .edside { position: absolute; inset: 0 auto 0 0; width: 300px; background: var(--side); border-right: 1px solid #000; padding: 58px 14px; }
  .edmain { position: absolute; left: 300px; right: 0; top: 0; bottom: 0; }
  .edtop { height: 60px; background: var(--bar); border-bottom: 1px solid #000; display: flex; align-items: center; padding: 0 22px; font-weight: 650; font-size: 20px; }
  .edtop .run { margin-left: auto; display: flex; gap: 8px; align-items: center; padding: 5px 16px; border-radius: 8px; background: rgba(255,255,255,.14); font-weight: 500; font-size: 17px; }
  .form { padding: 18px 24px; }
  .form h6 { color: var(--mute); font-size: 15px; margin: 16px 0 6px; font-weight: 600; }
  .group { border-radius: 10px; background: rgba(255,255,255,.06); }
  .group > div { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 17px; }
  .group > div:last-child { border-bottom: 0; }
  .group .val { margin-left: auto; color: var(--mint); }
  .group svg { color: var(--mint); }
  .hint { color: var(--mute); font-size: 14.5px; margin-top: 6px; }

  /* Words */
  #chapter { position: absolute; left: 44px; top: 54px; padding: 6px 16px; border-radius: 99px; background: rgba(3,10,9,.86); color: var(--mint); font-weight: 600; font-size: 19px; box-shadow: 0 0 0 1px rgba(143,240,216,.36); visibility: hidden; z-index: 40; }
  #caption { position: absolute; left: 0; right: 0; bottom: 0; height: 122px; display: grid; place-items: center; text-align: center; padding: 0 120px; background: linear-gradient(to top, rgba(3,10,9,.98) 70%, rgba(3,10,9,.0)); font-size: 34px; font-weight: 600; z-index: 40; }
  #caption span { display: block; text-wrap: balance; line-height: 1.25; }
  #caption b { color: var(--mint); font-weight: 650; }
  #card { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; z-index: 50; background: radial-gradient(70% 70% at 50% 45%, #0e4a42, #031110); visibility: hidden; }
  #card small { display: block; color: var(--mint); font-size: 30px; font-weight: 600; margin-bottom: 10px; }
  #card h1 { font-size: 88px; font-weight: 700; letter-spacing: -.01em; }
  #card ol { list-style: none; padding: 0; margin-top: 32px; display: flex; gap: 14px; color: var(--mint); font-size: 25px; font-weight: 500; }
  #card ol li { padding: 7px 20px; border-radius: 99px; box-shadow: 0 0 0 1px rgba(143,240,216,.4); }
  #keys { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); display: flex; gap: 14px; z-index: 30; visibility: hidden; }
  #keys kbd { min-width: 106px; height: 106px; padding: 0 20px; display: grid; place-items: center; border-radius: 22px; font: 500 52px -apple-system; color: var(--mint); background: linear-gradient(#183530, #0b1f1b); box-shadow: 0 0 0 1px rgba(143,240,216,.45), 0 8px 0 #031210, 0 24px 50px rgba(0,0,0,.6); }
  #cursor { position: absolute; left: 0; top: 0; z-index: 35; pointer-events: none; }
  #ripple { position: absolute; width: 56px; height: 56px; margin: -28px; border: 4px solid var(--mint); border-radius: 50%; z-index: 34; visibility: hidden; }
</style>
<div id="stage"></div>
<script src="tutorial.js"></script>
